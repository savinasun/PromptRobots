# Every piece of text the model is shown, apart from the two long prose files next to this one
# (SYSTEM_PROMPT.md and TILT_NOTE.md). Nothing model-facing is hard-coded in astra_yam/*.py:
# the loader is astra_yam/prompts.py and each key is addressed as e.g. prompt("tools.note").
#
# `>-` folds every line break into a single space, so a description stays one line in the request no
# matter how it is wrapped here; `|-` keeps the line breaks exactly as written. Do not leave a blank
# line inside a `>-` block (it becomes a newline). Braces are format placeholders and must be kept.

tools:
  action_targets: >-
    All declared dimensions must be present. Set each changed dimension to a numeric absolute target;
    set every unchanged dimension to null to preserve its current value. Supply at least one numeric target.
    No strings, commentary, or extra fields are allowed.
  observe: >-
    Capture another observation while holding the measured arm pose and preserving the gripper command.
    Use to resolve uncertain object locations or verify an action result without moving. Costs one LLM call, no motion waypoints.
  lesson: >-
    Optional short, tentative lesson learned in this episode from an action and its observed result.
    Record transferable corrections such as an approach or grasp adjustment, not transient object positions.
    Omit if no new evidence. The harness keeps the latest six lessons; new images can disprove them.
  move_to:
    description: >-
      Move to absolute Cartesian end-effector targets (meters for positions, radians for rotations, per the
      dimension labels). The motion is a straight line interpolated at a fixed safe speed and the result reports
      its step count. Unnamed dimensions hold their current value. Coordinates are absolute in the embodiment's
      declared frame; on multi-arm embodiments each arm uses its own base frame and axes may differ between arms
      depending on mounting. Rotation dimensions are absolute targets measured relative to the trial's start
      orientation (0 means the start orientation) and interpolate linearly without wrapping, so prefer
      intermediate values for large rotations. Per-dimension bounds: {bounds}.
    targets: >-
      Map of dimension name to value. Valid names: {dim_names}
    note: >-
      What you observe right now in the observation (images, if any, and state), and why you chose this motion.
      The user reads these notes live and in the saved transcript to follow what you see and what you decide.
      Write for them, in one or two plain sentences.
  done:
    description: >-
      Declare the task finished. The session ends holding position. This is model-reported completion; the
      operator confirms success.
  give_up:
    description: >-
      Stop trying; the task cannot be completed. The trial ends.
  hindsight: >-
    What do you know now that you wish you had known at the start of this episode? Concrete, transferable facts
    about this rig, task, or embodiment (camera mounting and extrinsics, table and base geometry, gripper axis
    and offsets, controller behavior, metric scale), written as advice to a future agent attempting the same
    task. Say 'none' if nothing qualifies.

# One observation message per turn: this text, then a label + image per camera.
observation:
  text: |-
    Current observation.
    Instruction: {goal}
    state[joint_pos]: {joint_pos}
    state[eef_state]: {eef_state}
    Gateway waypoints remaining in this session: {waypoints_remaining}.
  camera_label: >-
    camera '{camera}' (step {step}):
  image_omitted: >-
    [camera image omitted from history]

# Messages the session adds to the running conversation.
session:
  actions_only: |-
    ACTION-ONLY OUTPUT CONTRACT. Select the next action directly from the current observation.
    Do not emit a thinking section, reasoning, analysis, plans, explanations, narration, or any language response.
    Return exactly one of the provided action tool calls and only its schema-defined arguments.
    move_to accepts numeric targets, with null for dimensions to hold. Terminal and observe actions take {{}}.
    Do not generate note, lesson, summary, reason, or hindsight fields. This output contract overrides any
    request for written commentary in optional strategy advice or operator feedback. Use observations and
    action results to adapt the next action without writing intermediate deliberation or memory notes.
    API-provided reasoning summaries are separate diagnostic metadata, not action arguments or assistant messages.
  language_output: |-
    Every move_to must include a short note describing the observation and purpose of the motion.
    done and give_up must include their explanation and hindsight. Record only evidence-supported lessons.
  action_context: |-
    Observation sequence: {sequence}; captured {elapsed:.2f} seconds after trial start.
    Latest images override earlier object positions and plans. An interrupted target is NOT completed.
  policy_notes: |-
    Optional strategy (subordinate to the embodiment and gateway rules):
    {notes}
  reactive_context: |-
    Observation sequence: {sequence}; captured {elapsed:.2f} seconds after trial start.
    Latest images override earlier object positions and plans. An interrupted target is NOT completed.
    Tentative lessons from this episode (model notes, not verified facts): {lessons}
  reactive_rules: |-
    Dynamic scene mode: move_to executes at most {seconds:g} seconds of trajectory, then returns for observation.
    If the status is observation_required, only the reported portion ran; replan from measured state.
    The harness may discard a decision if the fixed camera changed during inference. Re-localize from the new image.
    Derive the next subgoal and observable completion conditions from the user's goal and current scene.
    Ground object identity, contact state, and target locations in the latest images and measured pose.
    Before each action, check its preconditions; after it, compare the observed result with the intended effect.
    If progress differs, adjust one supported assumption or action rather than repeating a failed command unchanged.
    When objects move, reassess which subgoals still hold. Preserve useful progress and a secure grasp when appropriate;
    avoid pursuing a stale target through contact. Reobserve if visibility or support is uncertain.
    Use observe for a stationary camera update. Never combine gripper opening with changing any pose target;
    align, inspect, then release in a separate call. Do not infer success from a command being accepted
    or assume calibration that has not been observed.
    Respond with exactly one of move_to, observe, done, give_up. Model-reported done still requires visual evidence.
  reactive_lessons: |-
    Put a short new evidence-based lesson in the optional lesson field when useful. Lessons are tentative
    and local to this episode. Do not memorize transient coordinates as lessons.
  reactive_reminder: >-
    Respond with exactly one tool call: move_to, observe, done, or give_up.
  scene_changed: >-
    Scene or operator guidance changed while deciding. This proposed action was not executed.
    Re-localize task-relevant objects and reassess action preconditions from the new observation;
    previous target coordinates and assumptions may be stale.
  goal: >-
    Goal: {goal}
  operator_feedback: >-
    Operator feedback: {feedback}
  tool_call_reminder: >-
    Reminder: respond with exactly one tool call (move_to, done, or give_up).
