# One shared strategy across tasks. No task profile or initial policy notes required.
# Environment-specific resets and verifiers stay outside the policy context.
cases:
  - id: stack_train
    goal: Pick up the blue block and stack it on the green block.
    scene: blocks
    verifier: blue_on_green
    seed: 1
    split: train
  - id: stack_validation
    goal: Pick up the blue block and stack it on the green block.
    scene: blocks
    verifier: blue_on_green
    seed: 101
    split: validation
    jitter_m: 0.008
  - id: lid_train
    goal: Open the AirPods case lid. Keep the body supported and release the lid so it stays open.
    scene: airpods
    verifier: airpods_open
    seed: 2
    split: train
  - id: lid_validation
    goal: Open the AirPods case lid. Keep the body supported and release the lid so it stays open.
    scene: airpods
    verifier: airpods_open
    seed: 102
    split: validation
    jitter_m: 0.008
  - id: container_train
    goal: Pick up the charging case and place it inside the green bowl.
    scene: airpod_bowl
    verifier: case_in_green_bowl
    seed: 3
    split: train
    disturbances: [[before_release, 0.08, 0.0]]
  - id: container_validation
    goal: Pick up the charging case and place it inside the green bowl.
    scene: airpod_bowl
    verifier: case_in_green_bowl
    seed: 103
    split: validation
    jitter_m: 0.005
    disturbances: [[before_release, 0.0, 0.08]]
